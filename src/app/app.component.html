<div class="theme-toggle-bar">
  <button class="btn-theme-toggle" (click)="toggleTheme()" [title]="isDark ? 'Switch to light mode' : 'Switch to dark mode'">
    @if (isDark) {
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="7.5" cy="7.5" r="3"/>
        <line x1="7.5" y1="1" x2="7.5" y2="2.5"/>
        <line x1="7.5" y1="12.5" x2="7.5" y2="14"/>
        <line x1="1" y1="7.5" x2="2.5" y2="7.5"/>
        <line x1="12.5" y1="7.5" x2="14" y2="7.5"/>
        <line x1="2.9" y1="2.9" x2="4" y2="4"/>
        <line x1="11" y1="11" x2="12.1" y2="12.1"/>
        <line x1="11" y1="4" x2="12.1" y2="2.9"/>
        <line x1="2.9" y1="12.1" x2="4" y2="11"/>
      </svg>
    }
    @if (!isDark) {
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
        <path d="M13 7.5a5.5 5.5 0 1 1-6-5.48A4.5 4.5 0 0 0 13 7.5z"/>
      </svg>
    }
    {{ isDark ? 'Light' : 'Dark' }}
  </button>
</div>

<div class="container">
  <app-grid></app-grid>
</div>
