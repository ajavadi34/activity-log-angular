<div class="theme-toggle-bar">
  <button class="btn-theme-toggle" (click)="toggleTheme()" [title]="isDark ? 'Switch to light mode' : 'Switch to dark mode'">
    @if (isDark) {
      <svg width="18" height="18" viewBox="0 0 15 15" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="7.5" cy="7.5" r="3"/>
        <line x1="7.5" y1="1" x2="7.5" y2="2.5"/>
        <line x1="7.5" y1="12.5" x2="7.5" y2="14"/>
        <line x1="1" y1="7.5" x2="2.5" y2="7.5"/>
        <line x1="12.5" y1="7.5" x2="14" y2="7.5"/>
        <line x1="2.9" y1="2.9" x2="4" y2="4"/>
        <line x1="11" y1="11" x2="12.1" y2="12.1"/>
        <line x1="11" y1="4" x2="12.1" y2="2.9"/>
        <line x1="2.9" y1="12.1" x2="4" y2="11"/>
      </svg>
    }
    @if (!isDark) {
      <svg width="18" height="18" viewBox="0 0 15 15" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
        <path d="M13 7.5a5.5 5.5 0 1 1-6-5.48A4.5 4.5 0 0 0 13 7.5z"/>
      </svg>
    }
    {{ isDark ? 'Light' : 'Dark' }}
  </button>
</div>

<div class="row mt-3 mb-3">
  <div class="col text-nowrap">
    <h1 class="text-primary">
      <span class="pointer" (click)="reset()">Logs
        <i class="fa fa-file-text-o" aria-hidden="true"></i>
      </span>
    </h1>
  </div>
  <div class="col text-end">
    @if (grid.rows && grid.rows.length) {
      <span [innerHTML]="getPaginationText()"></span>
      }<span class="me-2"></span>
      <span class="header-icons">
        <a [routerLink]="[]" (click)="manageLogTypes()"><i class="fa fa-cog" aria-hidden="true"></i></a>
        <a [routerLink]="[]" (click)="print()" class="ms-2"><i class="fa fa-print" aria-hidden="true"></i></a>
      </span>
    </div>
  </div>

  <div class="row mb-2">
    <div class="col-sm-2 align-self-center">
      <a [routerLink]="[]" title="Add new log" (click)="createLog()">
        <i class="fa fa-2x fa-plus-square-o add-new-record" aria-hidden="true"></i>
      </a>
    </div>
    <div class="col-sm-10">
      <div class="row justify-content-end">
        <label class="col-sm-2 col-form-label text-nowrap text-sm-end">Filter By:</label>
        <div class="col-sm-4 mb-2">
          <select class="form-select" (change)="reloadLogs()" [(ngModel)]="logTypeId">
            <option value="0">None</option>
            @for (type of grid.types; track type) {
              <option [value]="type.typeId">{{ type.name }}</option>
            }
          </select>
        </div>
        <div class="col-sm-2">
          <ul class="pagination">
            <li class="page-item" [class.disabled]="isFirstPage">
              <a class="page-link" [routerLink]="[]" (click)="previousPage()"><i class="fa fa-chevron-left"
              aria-hidden="true"></i></a>
            </li>
            <li class="page-item" [class.disabled]="isLastPage">
              <a class="page-link" [routerLink]="[]" (click)="nextPage()"><i class="fa fa-chevron-right"
              aria-hidden="true"></i></a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <div class="table-responsive">
    @if (grid.rows) {
      <table class="table text-secondary">
        <thead>
          <tr>
            <th scope="col"></th>
            @for (title of columnTitles; track title) {
              <th scope="col">
                {{ title }}
              </th>
            }
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          @for (row of grid.rows; track row) {
            <tr>
              <td>
                <i class="fa fa-pencil" aria-hidden="true" title="Edit log" (click)="editLog(row.id)"></i>
              </td>
              <td>
                {{ row.type }}
              </td>
              <td>
                {{ row.title }}
              </td>
              <td>
                {{ row.description }}
              </td>
              <td>
                @if (row.link) {
                  <a [href]="row.link" target="_blank"><i class="fa fa-external-link"
                  aria-hidden="true"></i></a>
                }
              </td>
              <td>
                {{ row.date | date:'shortDate' }}
              </td>
              <td>
                <i class="fa fa-trash fa-1x" aria-hidden="true" title="Delete log"
                (click)="deleteLog(row.id, $event)"></i>
              </td>
            </tr>
          }
        </tbody>
      </table>
    }
  </div>
